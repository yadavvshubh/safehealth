{% extends "base.html" %}
{% block title %}Verification code - SafeHealth{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Verification code</h1>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" autocomplete="off">
    {{ m.csrf() }}
    <label>6-digit code from your authenticator app
      <input name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus></label>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="hint">Step 2 of 2.</p>
</section>
{% endblock %}
