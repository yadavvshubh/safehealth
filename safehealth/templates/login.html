{% extends "base.html" %}
{% block title %}Sign in - SafeHealth{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" autocomplete="off">
    {{ m.csrf() }}
    <label>Username<input name="username" maxlength="64" required autofocus></label>
    <label>Password<input type="password" name="password" maxlength="256" required></label>
    <button class="btn" type="submit">Continue</button>
  </form>
  <p class="hint">Step 1 of 2. You will be asked for your authenticator code next.</p>
</section>
{% endblock %}
